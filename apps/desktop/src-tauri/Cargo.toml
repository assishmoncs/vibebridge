[package]
name = "vibebridge"
version = "0.1.0"
description = "VibeBridge - Local MCP execution bridge for Gemini Spark"
authors = ["VibeBridge Contributors"]
license = "MIT"
repository = "https://github.com/assishmoncs/vibebridge"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
